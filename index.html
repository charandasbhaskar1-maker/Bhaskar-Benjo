
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#080b12">
<title>Bhaskar Benjo</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#080b12;
 color:#fff;
 font-family:Arial,sans-serif;
 overflow:hidden;
 touch-action:manipulation;
}
.app{
 width:100%;
 height:100dvh;
 display:flex;
 flex-direction:column;
 background:linear-gradient(145deg,#111827,#070910);
}
header{
 height:48px;
 flex-shrink:0;
 display:flex;
 justify-content:space-between;
 align-items:center;
 padding:0 12px;
 border-bottom:1px solid #283247;
}
.logo{
 font-size:18px;
 font-weight:900;
 letter-spacing:1px;
 color:#29d9ff;
}
.logo span{color:#9273ff}
.status{
 color:#9aa8bd;
 font-size:11px;
}
.controls{
 flex-shrink:0;
 display:flex;
 align-items:center;
 justify-content:center;
 gap:7px;
 padding:7px;
 flex-wrap:wrap;
}
button{
 border:1px solid #35435e;
 background:#151d2b;
 color:#fff;
 border-radius:8px;
 padding:8px 12px;
 font-size:12px;
 font-weight:bold;
}
button:active,button.active{
 background:#7554ef;
}
.volume{
 display:flex;
 align-items:center;
 gap:5px;
 color:#aab5c9;
 font-size:11px;
}
input[type=range]{
 width:85px;
 accent-color:#8b68ff;
}
.main{
 flex:1;
 min-height:0;
 display:flex;
 flex-direction:column;
 justify-content:center;
 padding:5px 8px 8px;
}
.nav{
 display:flex;
 justify-content:space-between;
 align-items:center;
 flex-shrink:0;
 padding:3px 0 8px;
}
.nav small{
 color:#8d9ab1;
 font-size:10px;
}
.keyboard-scroll{
 flex:1;
 min-height:0;
 width:100%;
 overflow-x:auto;
 overflow-y:hidden;
 scrollbar-width:thin;
 scrollbar-color:#7654ed #151b28;
 border-radius:8px;
}
.keyboard{
 position:relative;
 height:100%;
 user-select:none;
 -webkit-user-select:none;
}
.key{
 position:absolute;
 top:0;
 display:flex;
 align-items:center;
 justify-content:flex-end;
 flex-direction:column;
 touch-action:none;
 -webkit-tap-highlight-color:transparent;
}
.white{
 height:100%;
 border:1px solid #aeb8c7;
 background:linear-gradient(180deg,#fff 0%,#e7eaf0 100%);
 color:#263248;
 border-radius:0 0 7px 7px;
 z-index:1;
}
.white.active{
 background:linear-gradient(#a9e5ff,#62bbff);
}
.black{
 height:64%;
 border:1px solid #05070a;
 background:linear-gradient(180deg,#30394b,#090c12);
 color:#fff;
 border-radius:0 0 6px 6px;
 z-index:3;
 box-shadow:0 5px 8px #0007;
}
.black.active{
 background:linear-gradient(#9578ff,#4931a5);
}
.note{
 font-size:10px;
 font-weight:bold;
 margin-bottom:4px;
 pointer-events:none;
}
.swar{
 font-size:9px;
 color:#68758a;
 margin-bottom:9px;
 pointer-events:none;
}
.black .note{
 font-size:9px;
 margin-bottom:5px;
}
.black .swar{display:none}
footer{
 flex-shrink:0;
 height:22px;
 display:flex;
 align-items:center;
 justify-content:center;
 color:#59677e;
 font-size:9px;
}
.portrait-warning{
 display:none;
 position:fixed;
 inset:0;
 background:#080b12;
 z-index:1000;
 align-items:center;
 justify-content:center;
 flex-direction:column;
 text-align:center;
 padding:20px;
}
.portrait-warning div{
 font-size:42px;
 margin-bottom:15px;
}
.portrait-warning p{
 color:#b9c4d8;
 font-size:14px;
 line-height:1.7;
}
@media (orientation:portrait){
 .portrait-warning{display:flex}
 .app{visibility:hidden}
}
</style>
</head>

<body>

<div class="portrait-warning">
 <div>📱 ↻</div>
 <h2>Bhaskar Benjo</h2>
 <p>कृपया मोबाइल को आड़ा (Landscape) घुमाएँ<br>
 बैंजो बजाने के लिए Landscape मोड जरूरी है।</p>
</div>

<div class="app">

<header>
 <div class="logo">BHASKAR <span>BENJO</span></div>
 <div class="status" id="status">बैंजो तैयार 🎵</div>
</header>

<div class="controls">
 <button id="soundBtn" class="active">🔊 SOUND</button>
 <button id="stopBtn">⏹ STOP</button>
 <button id="octDown">− OCT</button>
 <button id="octUp">+ OCT</button>
 <div class="volume">
 VOL <input id="volume" type="range" min="0" max="100" value="70">
 </div>
</div>

<div class="main">

<div class="nav">
 <button id="leftBtn">◀</button>
 <small>27 NOTES · INDIAN BENJO · ↔</small>
 <button id="rightBtn">▶</button>
</div>

<div class="keyboard-scroll" id="scrollBox">
 <div class="keyboard" id="keyboard"></div>
</div>

</div>

<footer>BHASKAR BENJO · MADE FOR MOBILE</footer>
</div>

<script>
const keyboard=document.getElementById("keyboard");
const scrollBox=document.getElementById("scrollBox");
const status=document.getElementById("status");

let baseMidi=48;
const totalNotes=27;
const whiteWidth=58;
const blackWidth=35;

let audio=null;
let master=null;
let enabled=true;
let volume=.70;

const voices=new Map();

const noteNames=["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
const swarNames=["सा","रे","रे","ग","ग","म","म","प","प","ध","ध","नि"];

function isBlack(n){
 return [1,3,6,8,10].includes(n%12);
}

function freq(m){
 return 440*Math.pow(2,(m-69)/12);
}

function initAudio(){
 if(audio)return;
 audio=new (window.AudioContext||window.webkitAudioContext)();
 master=audio.createGain();
 master.gain.value=volume;
 master.connect(audio.destination);
}

function stopVoice(id){
 const v=voices.get(id);
 if(!v)return;
 const now=audio.currentTime;
 v.gainNode.gain.cancelScheduledValues(now);
 v.gainNode.gain.setTargetAtTime(.0001,now,.045);
 try{
  v.osc.forEach(o=>o.stop(now+.18));
 }catch(e){}
 voices.delete(id);
}

function startVoice(id,midi){
 initAudio();
 if(audio.state==="suspended")audio.resume();
 stopVoice(id);

 const now=audio.currentTime;
 const gainNode=audio.createGain();
 gainNode.gain.setValueAtTime(.0001,now);
 gainNode.gain.exponentialRampToValueAtTime(.38,now+.012);
 gainNode.gain.exponentialRampToValueAtTime(.14,now+.18);
 gainNode.connect(master);

 const frequencies=[1,2,3,4];
 const osc=[];
 frequencies.forEach((mult,i)=>{
  const o=audio.createOscillator();
  const g=audio.createGain();
  o.type=i===0?"sawtooth":i===1?"triangle":"sine";
  o.frequency.value=freq(midi)*mult;
  g.gain.value=[.52,.23,.10,.035][i];
  o.connect(g);
  g.connect(gainNode);
  o.start(now);
  osc.push(o);
 });

 voices.set(id,{gainNode,osc,midi});
}

function glide(id,midi){
 const v=voices.get(id);
 if(!v||v.midi===midi)return;
 const now=audio.currentTime;
 v.osc.forEach((o,i)=>{
  o.frequency.setTargetAtTime(freq(midi)*(i+1),now,.025);
 });
 v.midi=midi;
}

function releaseAll(){
 [...voices.keys()].forEach(stopVoice);
 keyboard.querySelectorAll(".key").forEach(k=>k.classList.remove("active"));
 status.textContent="बैंजो तैयार 🎵";
}

function buildKeyboard(){
 keyboard.innerHTML="";
 let whiteCount=0;
 const notes=[];

 for(let i=0;i<totalNotes;i++){
  const midi=baseMidi+i;
  const black=isBlack(midi);
  if(!black){
   notes.push({midi,black:false,whiteIndex:whiteCount});
   whiteCount++;
  }else{
   notes.push({midi,black:true,whiteIndex:whiteCount});
  }
 }

 keyboard.style.width=(whiteCount*whiteWidth)+"px";

 notes.forEach(n=>{
  const el=document.createElement("div");
  el.className="key "+(n.black?"black":"white");
  el.dataset.midi=n.midi;

  el.style.width=(n.black?blackWidth:whiteWidth)+"px";
  el.style.left=n.black
   ? (n.whiteIndex*whiteWidth-blackWidth/2)+"px"
   : (n.whiteIndex*whiteWidth)+"px";

  const name=noteNames[n.midi%12];
  const octave=Math.floor(n.midi/12)-1;

  const label=document.createElement("div");
  label.className="note";
  label.textContent=name+octave;

  const swar=document.createElement("div");
  swar.className="swar";
  swar.textContent=swarNames[n.midi%12];

  el.append(label,swar);

  el.addEventListener("pointerdown",e=>{
   e.preventDefault();
   if(!enabled)return;
   el.classList.add("active");
   startVoice(e.pointerId,n.midi);
   status.textContent="🎵 "+name+octave;
  });

  keyboard.appendChild(el);
 });
}

function findKey(x,y){
 const el=document.elementFromPoint(x,y);
 return el&&el.closest(".key");
}

document.addEventListener("pointermove",e=>{
 if(!voices.has(e.pointerId))return;
 const key=findKey(e.clientX,e.clientY);
 if(!key)return;
 const midi=Number(key.dataset.midi);
 glide(e.pointerId,midi);
 keyboard.querySelectorAll(".key").forEach(k=>{
  k.classList.toggle("active",Number(k.dataset.midi)===midi);
 });
});

document.addEventListener("pointerup",e=>{
 stopVoice(e.pointerId);
 keyboard.querySelectorAll(".key").forEach(k=>k.classList.remove("active"));
});

document.addEventListener("pointercancel",releaseAll);

document.getElementById("stopBtn").onclick=releaseAll;

document.getElementById("soundBtn").onclick=()=>{
 enabled=!enabled;
 const b=document.getElementById("soundBtn");
 b.classList.toggle("active",enabled);
 b.textContent=enabled?"🔊 SOUND":"🔇 SOUND";
 if(!enabled)releaseAll();
};

document.getElementById("volume").oninput=e=>{
 volume=Number(e.target.value)/100;
 if(master)master.gain.value=volume;
};

document.getElementById("octDown").onclick=()=>{
 releaseAll();
 baseMidi-=12;
 buildKeyboard();
 scrollBox.scrollLeft=0;
};

document.getElementById("octUp").onclick=()=>{
 releaseAll();
 baseMidi+=12;
 buildKeyboard();
 scrollBox.scrollLeft=0;
};

document.getElementById("leftBtn").onclick=()=>{
 scrollBox.scrollBy({left:-400,behavior:"smooth"});
};

document.getElementById("rightBtn").onclick=()=>{
 scrollBox.scrollBy({left:400,behavior:"smooth"});
};

buildKeyboard();

// Landscape lock: requires browser support and user interaction.
async function lockLandscape(){
 try{
  if(screen.orientation&&screen.orientation.lock){
   await screen.orientation.lock("landscape");
  }
 }catch(e){}
}

document.getElementById("soundBtn").addEventListener("pointerdown",lockLandscape,{once:true});
document.getElementById("stopBtn").addEventListener("pointerdown",lockLandscape,{once:true});
document.getElementById("octUp").addEventListener("pointerdown",lockLandscape,{once:true});
document.getElementById("octDown").addEventListener("pointerdown",lockLandscape,{once:true});
</script>
</body>
</html>
