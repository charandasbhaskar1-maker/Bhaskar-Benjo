
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#080b12">
<title>Bhaskar Benjo V2</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
 margin:0;background:#080b12;color:#f5f7ff;
 font-family:system-ui,Arial;overflow:hidden;user-select:none
}
button{border:0;color:white;font-weight:800;touch-action:manipulation}
.app{height:100dvh;width:100%;padding:5px;display:flex;flex-direction:column}
.header{
 display:flex;align-items:center;gap:10px;background:#151b28;
 padding:8px 12px;border-radius:12px;flex-shrink:0
}
.logo{
 width:38px;height:38px;display:grid;place-items:center;
 border-radius:11px;background:linear-gradient(135deg,#8057ff,#29d9ff);font-size:22px
}
.header h1{font-size:16px;margin:0}
.header p{font-size:10px;color:#9aa5b8;margin:2px 0}
.panel{
 flex:1;min-height:0;margin-top:5px;padding:6px;
 background:#151b28;border-radius:12px;display:flex;flex-direction:column
}
.top{display:flex;align-items:center;gap:5px}
.display{
 flex:1;min-width:0;background:#080b12;border-radius:9px;padding:4px 10px;
 display:flex;justify-content:space-between;align-items:center;min-height:34px
}
.note{font-size:20px;font-weight:900;color:#29d9ff}
.status{font-size:10px;color:#9aa5b8;text-align:right}
.controls{display:flex;gap:5px;margin-top:4px}
.controls button{flex:1;padding:7px;border-radius:9px;font-size:11px;background:#263047}
.purple{background:#8057ff!important}
.volume{display:flex;align-items:center;gap:8px;margin:3px;flex-shrink:0}
.volume span{font-size:10px;color:#9aa5b8}
input[type=range]{flex:1;min-width:0;accent-color:#8057ff}
.octave{display:flex;justify-content:center;align-items:center;gap:10px;margin:3px}
.octave button{width:38px;height:27px;border-radius:8px;background:#263047;font-size:17px}
.octinfo{text-align:center;min-width:60px}
.octinfo small{display:block;color:#9aa5b8;font-size:9px}
.octinfo strong{font-size:15px}
.keyboard{
 flex:1;min-height:0;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));
 gap:3px;margin-top:3px;touch-action:none
}
.key{
 display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;
 min-width:0;border-radius:0 0 6px 6px;border:1px solid #485265;
 touch-action:none;overflow:hidden
}
.white{background:linear-gradient(#fff,#dce4ef);color:#111827;border-color:#b7c0ce}
.black{background:linear-gradient(#343d50,#080b12);color:#fff}
.key.active{background:linear-gradient(#29d9ff,#8057ff)!important;color:white!important;box-shadow:0 0 12px #29d9ff66}
.key span{text-align:center;font-size:clamp(9px,2.5vw,13px);font-weight:900;pointer-events:none}
.key small{display:block;font-size:9px}
.footer{text-align:center;color:#69758a;font-size:9px;padding-top:3px}
.rotate{
 position:fixed;inset:0;z-index:99;display:none;align-items:center;justify-content:center;
 background:#080b12;text-align:center;padding:20px
}
.rotate div{background:#151b28;padding:24px;border-radius:20px;max-width:320px}
.rotate h2{margin:8px}
.rotate p{color:#9aa5b8;font-size:13px}
.rotate button{background:#8057ff;border-radius:10px;padding:12px 18px}
@media(orientation:portrait){.rotate{display:flex}}
@media(orientation:landscape){
 .header{display:none}
 .app{padding:3px}
 .panel{margin:0;padding:4px}
 .display{min-height:29px}
 .note{font-size:17px}
 .controls{margin-top:3px}
 .controls button{padding:5px;min-height:27px}
 .volume{margin:2px}
 .octave{margin:1px}
 .octave button{height:23px}
 .keyboard{margin-top:2px;gap:2px}
 .key{height:100%;padding-bottom:3px}
 .footer{display:none}
}
</style>
</head>
<body>

<div class="rotate">
 <div>
  <div style="font-size:48px">🎸</div>
  <h2>Bhaskar Benjo</h2>
  <p>बैंजो बजाने के लिए मोबाइल आड़ा करें।</p>
  <button onclick="goLandscape()">Landscape खोलें</button>
 </div>
</div>

<div class="app">
 <div class="header">
  <div class="logo">🎸</div>
  <div><h1>Bhaskar Benjo</h1><p>Benjo Sound Engine V2</p></div>
 </div>

 <div class="panel">
  <div class="top">
   <div class="display">
    <div class="note" id="noteDisplay">READY</div>
    <div class="status" id="status">Touch to play</div>
   </div>
  </div>

  <div class="controls">
   <button class="purple" id="soundBtn" onclick="toggleSound()">🔊 SOUND ON</button>
   <button onclick="stopAll()">■ STOP</button>
   <button onclick="goLandscape()">⛶ FULL</button>
  </div>

  <div class="volume">
   <span>VOL</span>
   <input id="volume" type="range" min="0" max="100" value="75">
   <span id="volText">75%</span>
  </div>

  <div class="octave">
   <button onclick="changeOctave(-1)">−</button>
   <div class="octinfo"><small>OCTAVE</small><strong id="octaveDisplay">4</strong></div>
   <button onclick="changeOctave(1)">+</button>
  </div>

  <div class="keyboard" id="keyboard"></div>
  <div class="footer">BENJO SOUND ENGINE V2 • TOUCH • SLIDE • MULTI-NOTE</div>
 </div>
</div>

<script>
let ctx=null,master=null;
let soundOn=true,octave=4;
const voices=new Map();
const pointerKey=new Map();

const notes=[
 {n:"C",h:"सा",s:0,b:false},
 {n:"C#",h:"",s:1,b:true},
 {n:"D",h:"रे",s:2,b:false},
 {n:"D#",h:"",s:3,b:true},
 {n:"E",h:"ग",s:4,b:false},
 {n:"F",h:"म",s:5,b:false},
 {n:"F#",h:"",s:6,b:true},
 {n:"G",h:"प",s:7,b:false},
 {n:"G#",h:"",s:8,b:true},
 {n:"A",h:"ध",s:9,b:false},
 {n:"A#",h:"",s:10,b:true},
 {n:"B",h:"नि",s:11,b:false}
];

function audioInit(){
 if(ctx)return;
 ctx=new (window.AudioContext||window.webkitAudioContext)();
 master=ctx.createGain();
 master.gain.value=Number(volume.value)/100;
 master.connect(ctx.destination);
}

function hz(midi){return 440*Math.pow(2,(midi-69)/12)}
function midiFor(index){return 12*(octave+1)+notes[index].s}

function makeBenjoVoice(index,pid){
 if(!soundOn)return;
 audioInit();
 if(ctx.state==="suspended")ctx.resume();

 const old=voices.get(pid);
 if(old){
   glideVoice(pid,index);
   return;
 }

 const now=ctx.currentTime;
 const f=hz(midiFor(index));
 const amp=ctx.createGain();
 amp.gain.setValueAtTime(0.0001,now);
 amp.gain.exponentialRampToValueAtTime(0.5,now+0.006);
 amp.gain.exponentialRampToValueAtTime(0.19,now+0.09);

 const filter=ctx.createBiquadFilter();
 filter.type="lowpass";
 filter.frequency.setValueAtTime(7200,now);
 filter.Q.value=0.7;
 filter.connect(amp);
 amp.connect(master);

 // Bright plucked metallic synthesized timbre (not a piano sample).
 const specs=[
  {ratio:1,type:"sawtooth",level:0.22},
  {ratio:1,type:"triangle",level:0.55},
  {ratio:2.01,type:"sine",level:0.15},
  {ratio:3.02,type:"triangle",level:0.06},
  {ratio:4.04,type:"sine",level:0.035}
 ];
 const os=[];
 specs.forEach(spec=>{
  const o=ctx.createOscillator(),g=ctx.createGain();
  o.type=spec.type;
  o.frequency.setValueAtTime(f*spec.ratio,now);
  g.gain.value=spec.level;
  o.connect(g);g.connect(filter);o.start(now);
  os.push({o,g,ratio:spec.ratio});
 });

 // Tiny transient for a plucked attack
 const click=ctx.createOscillator(),clickGain=ctx.createGain();
 click.type="square";
 click.frequency.setValueAtTime(f*5,now);
 clickGain.gain.setValueAtTime(0.045,now);
 clickGain.gain.exponentialRampToValueAtTime(0.0001,now+0.025);
 click.connect(clickGain);clickGain.connect(master);
 click.start(now);click.stop(now+0.03);

 voices.set(pid,{amp,filter,os,index});
 pointerKey.set(pid,index);
 showNote(index);
 paintKeys();
}

function glideVoice(pid,newIndex){
 const v=voices.get(pid);
 if(!v)return;
 const now=ctx.currentTime;
 const target=hz(midiFor(newIndex));
 v.os.forEach(item=>{
  item.o.frequency.cancelScheduledValues(now);
  item.o.frequency.setTargetAtTime(target*item.ratio,now,0.035);
 });
 v.index=newIndex;
 pointerKey.set(pid,newIndex);
 showNote(newIndex);
 paintKeys();
}

function releaseVoice(pid){
 const v=voices.get(pid);
 if(!v)return;
 const now=ctx.currentTime;
 v.amp.gain.cancelScheduledValues(now);
 v.amp.gain.setValueAtTime(Math.max(v.amp.gain.value,0.0001),now);
 v.amp.gain.exponentialRampToValueAtTime(0.0001,now+0.12);
 v.os.forEach(item=>{try{item.o.stop(now+0.13)}catch(e){}});
 voices.delete(pid);
 pointerKey.delete(pid);
 paintKeys();
}

function showNote(i){
 noteDisplay.textContent=notes[i].n+octave;
 status.textContent="Benjo playing";
}

function paintKeys(){
 document.querySelectorAll(".key").forEach(k=>{
  const i=Number(k.dataset.i);
  k.classList.toggle("active",[...pointerKey.values()].includes(i));
 });
}

function stopAll(){
 [...voices.keys()].forEach(releaseVoice);
 noteDisplay.textContent="READY";
 status.textContent="Touch to play";
}

function toggleSound(){
 soundOn=!soundOn;
 soundBtn.textContent=soundOn?"🔊 SOUND ON":"🔇 SOUND OFF";
 soundBtn.classList.toggle("purple",soundOn);
 if(!soundOn)stopAll();
}

function changeOctave(d){
 octave=Math.max(2,Math.min(6,octave+d));
 octaveDisplay.textContent=octave;
}

volume.addEventListener("input",()=>{
 volText.textContent=volume.value+"%";
 if(master)master.gain.value=volume.value/100;
});

function keyAt(x,y){
 const el=document.elementFromPoint(x,y);
 return el?el.closest(".key"):null;
}

notes.forEach((note,i)=>{
 const k=document.createElement("div");
 k.className="key "+(note.b?"black":"white");
 k.dataset.i=i;
 k.innerHTML=`<span>${note.n}<small>${note.h}</small></span>`;

 k.addEventListener("pointerdown",e=>{
  e.preventDefault();
  try{k.setPointerCapture(e.pointerId)}catch(err){}
  makeBenjoVoice(i,e.pointerId);
 });

 k.addEventListener("pointermove",e=>{
  if(!voices.has(e.pointerId))return;
  const dest=keyAt(e.clientX,e.clientY);
  if(!dest)return;
  const ni=Number(dest.dataset.i);
  if(pointerKey.get(e.pointerId)!==ni)glideVoice(e.pointerId,ni);
 });

 k.addEventListener("pointerup",e=>releaseVoice(e.pointerId));
 k.addEventListener("pointercancel",e=>releaseVoice(e.pointerId));
 k.addEventListener("lostpointercapture",e=>releaseVoice(e.pointerId));
 keyboard.appendChild(k);
});

async function goLandscape(){
 try{
  if(!document.fullscreenElement)await document.documentElement.requestFullscreen();
 }catch(e){}
 try{
  if(screen.orientation?.lock)await screen.orientation.lock("landscape");
 }catch(e){
  alert("Auto-rotate ON करके फोन आड़ा करें।");
 }
}
</script>
</body>
</html>
