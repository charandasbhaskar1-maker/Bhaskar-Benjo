
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Bhaskar Benjo V5</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080b12;color:white;font-family:Arial;overflow:hidden}
.app{height:100dvh;display:flex;flex-direction:column;padding:6px;gap:6px}
.header,.display,.controls,.keyboardBox{
 background:#151b28;border:1px solid #263449;border-radius:12px
}
.header{display:flex;justify-content:space-between;align-items:center;padding:7px 12px}
.brand{color:#29d9ff;font-size:19px;font-weight:bold}
.version{font-size:10px;color:#9aa8bb}
.display{padding:6px 12px;display:flex;justify-content:space-between;align-items:center}
#noteDisplay{font-size:24px;color:#29d9ff;font-weight:bold}
#status{font-size:11px;color:#a5b4c8}
.controls{display:flex;align-items:center;justify-content:center;gap:6px;padding:6px;flex-wrap:wrap}
button{background:#1c2739;color:white;border:1px solid #3a4b62;border-radius:9px;padding:8px 11px;font-weight:bold}
button:active{background:#8057ff}
#soundBtn{background:#176c56}
.stop{background:#932a3b}
.volume{display:flex;align-items:center;gap:5px;font-size:11px}
input[type=range]{width:80px;accent-color:#29d9ff}
.keyboardBox{flex:1;min-height:0;padding:7px 4px;display:flex;flex-direction:column}
.keyboard{
 flex:1;min-height:0;display:flex;gap:3px;overflow-x:auto;overflow-y:hidden;
 align-items:stretch;scrollbar-width:thin;touch-action:pan-x;
 -webkit-overflow-scrolling:touch
}
.key{
 flex:0 0 62px;min-width:62px;border-radius:0 0 10px 10px;
 background:linear-gradient(#fff,#cbd5e1);color:#172033;
 border:1px solid #9baabd;box-shadow:0 4px 0 #66758b;
 display:flex;flex-direction:column;justify-content:flex-end;align-items:center;
 padding:8px 2px 12px;user-select:none;-webkit-user-select:none;touch-action:pan-x
}
.key .w{font-size:16px;font-weight:bold}
.key .i{font-size:13px;margin-top:6px;color:#40536c}
.key.active{background:linear-gradient(#b9f8ff,#29d9ff);transform:translateY(3px);box-shadow:0 1px #1687a5}
.hint{text-align:center;font-size:10px;color:#8293aa;padding-top:5px}
.footer{text-align:center;font-size:9px;color:#62728a}
.rotate{display:none;position:fixed;inset:0;background:#080b12;z-index:999;align-items:center;justify-content:center;text-align:center}
@media(orientation:portrait){.rotate{display:flex}}
@media(orientation:landscape){
 .app{padding:4px;gap:4px}
 .header{padding:4px 9px}.brand{font-size:16px}
 .display{padding:3px 9px}#noteDisplay{font-size:20px}
 button{padding:6px 9px;font-size:12px}
 .key{flex-basis:66px;min-width:66px}
 .keyboardBox{padding:4px}
}
</style>
</head>
<body>

<div class="rotate">
 <div>
  <div style="font-size:48px">🎸</div>
  <h2>Bhaskar Benjo</h2>
  <p>मोबाइल को Landscape घुमाएँ</p>
  <button onclick="goLandscape()">LANDSCAPE</button>
 </div>
</div>

<div class="app">
 <div class="header">
  <div class="brand">🎸 Bhaskar Benjo</div>
  <div class="version">SOUND ENGINE V5</div>
 </div>

 <div class="display">
  <div id="noteDisplay">सा</div>
  <div id="status">Benjo Ready</div>
 </div>

 <div class="controls">
  <button id="soundBtn">🔊 SOUND ON</button>
  <button class="stop" id="stopBtn">⏹ STOP</button>
  <button id="fullBtn">⛶ FULL</button>
  <button id="downBtn">− OCT</button>
  <span id="octaveDisplay">OCT 3</span>
  <button id="upBtn">+ OCT</button>
  <div class="volume">
   VOL <input id="volume" type="range" min="0" max="100" value="75">
   <span id="volText">75%</span>
  </div>
 </div>

 <div class="keyboardBox">
  <div class="keyboard" id="keyboard"></div>
  <div class="hint">◀ उँगली से बाएँ-दाएँ खिसकाएँ • सुर बजाएँ ▶</div>
 </div>
 <div class="footer">BHASKAR BENJO • 27 KEYS • MULTI TOUCH</div>
</div>

<script>
const $=id=>document.getElementById(id);
const keyboard=$("keyboard");
const notesW=["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
const notesI=["सा","रे♭","रे","ग♭","ग","म","म♭","प","ध♭","ध","नि♭","नि"];

let ctx=null,master=null;
let octave=3,soundOn=true;
let voices=new Map(),keys=[];
const pointers=new Map();

function initAudio(){
 if(ctx)return;
 ctx=new(window.AudioContext||window.webkitAudioContext)();
 master=ctx.createGain();
 master.gain.value=$("volume").value/100;
 const comp=ctx.createDynamicsCompressor();
 comp.threshold.value=-18;comp.ratio.value=4;
 comp.attack.value=.003;comp.release.value=.2;
 master.connect(comp);comp.connect(ctx.destination);
}
function freq(m){return 440*Math.pow(2,(m-69)/12)}
function midi(i){return 12*(octave+1)+i}

function noteName(i){
 return notesW[i%12]+" "+Math.floor(i/12+octave);
}
function show(i){
 $("noteDisplay").textContent=notesI[i%12];
 $("status").textContent=noteName(i);
}
function paint(i,on){
 if(keys[i])keys[i].classList.toggle("active",on);
}

function createVoice(i,pid){
 initAudio();
 if(ctx.state==="suspended")ctx.resume();
 const t=ctx.currentTime,f=freq(midi(i));
 const amp=ctx.createGain();
 amp.gain.setValueAtTime(.0001,t);
 amp.gain.exponentialRampToValueAtTime(.55,t+.008);
 amp.gain.exponentialRampToValueAtTime(.27,t+.1);

 const filter=ctx.createBiquadFilter();
 filter.type="lowpass";filter.frequency.value=4800;filter.Q.value=1.1;

 const parts=[
  [1,1,"sawtooth"],[2,.30,"triangle"],
  [3,.18,"sawtooth"],[4,.10,"triangle"],[5.02,.045,"sine"]
 ];
 const os=[];
 parts.forEach(p=>{
  const o=ctx.createOscillator(),g=ctx.createGain();
  o.type=p[2];o.frequency.value=f*p[0];g.gain.value=p[1];
  o.connect(g);g.connect(filter);o.start(t);
  os.push({o,ratio:p[0]});
 });

 // Plucked attack
 const a=ctx.createOscillator(),ag=ctx.createGain();
 a.type="square";a.frequency.value=f*2;
 ag.gain.setValueAtTime(.0001,t);
 ag.gain.exponentialRampToValueAtTime(.075,t+.003);
 ag.gain.exponentialRampToValueAtTime(.0001,t+.045);
 a.connect(ag);ag.connect(filter);a.start(t);a.stop(t+.05);

 // Metallic resonance
 const r=ctx.createOscillator(),rg=ctx.createGain();
 r.type="sine";r.frequency.value=f*2.76;rg.gain.value=.025;
 r.connect(rg);rg.connect(filter);r.start(t);

 filter.connect(amp);amp.connect(master);
 voices.set(pid,{amp,filter,os,r,i});
 pointers.set(pid,i);
 paint(i,true);show(i);
}

function glide(pid,i){
 const v=voices.get(pid);if(!v)return;
 const t=ctx.currentTime,f=freq(midi(i));
 v.os.forEach(x=>x.o.frequency.setTargetAtTime(f*x.ratio,t,.018));
 v.r.frequency.setTargetAtTime(f*2.76,t,.025);
 paint(v.i,false);v.i=i;pointers.set(pid,i);
 paint(i,true);show(i);
}

function release(pid){
 const v=voices.get(pid);if(!v)return;
 const t=ctx.currentTime;
 v.amp.gain.cancelScheduledValues(t);
 v.amp.gain.setValueAtTime(Math.max(v.amp.gain.value,.0001),t);
 v.amp.gain.exponentialRampToValueAtTime(.0001,t+.18);
 v.os.forEach(x=>x.o.stop(t+.2));v.r.stop(t+.2);
 setTimeout(()=>{v.amp.disconnect();v.filter.disconnect()},250);
 paint(v.i,false);voices.delete(pid);pointers.delete(pid);
}

function build(){
 keyboard.innerHTML="";keys=[];
 for(let i=0;i<27;i++){
  const k=document.createElement("div");
  k.className="key";k.dataset.i=i;
  k.innerHTML=`<span class="w">${notesW[i%12]}</span><span class="i">${notesI[i%12]}</span>`;
  keyboard.appendChild(k);keys.push(k);
 }
}
function keyAt(x,y){
 const el=document.elementFromPoint(x,y)?.closest(".key");
 return el?Number(el.dataset.i):null;
}

keyboard.addEventListener("pointerdown",e=>{
 const i=keyAt(e.clientX,e.clientY);
 if(i===null)return;
 e.preventDefault();initAudio();
 if(ctx.state==="suspended")ctx.resume();
 if(voices.has(e.pointerId))release(e.pointerId);
 createVoice(i,e.pointerId);
});
keyboard.addEventListener("pointermove",e=>{
 if(!voices.has(e.pointerId))return;
 const i=keyAt(e.clientX,e.clientY);
 if(i!==null&&pointers.get(e.pointerId)!==i)glide(e.pointerId,i);
});
function end(e){release(e.pointerId)}
keyboard.addEventListener("pointerup",end);
keyboard.addEventListener("pointercancel",end);
keyboard.addEventListener("lostpointercapture",end);

$("stopBtn").onclick=()=>{
 [...voices.keys()].forEach(release);
 $("noteDisplay").textContent="—";$("status").textContent="STOPPED";
};
$("soundBtn").onclick=()=>{
 soundOn=!soundOn;
 $("soundBtn").textContent=soundOn?"🔊 SOUND ON":"🔇 SOUND OFF";
 if(master)master.gain.setTargetAtTime(soundOn?$("volume").value/100:0,ctx.currentTime,.03);
};
$("volume").oninput=()=>{
 $("volText").textContent=$("volume").value+"%";
 if(master&&soundOn)master.gain.setTargetAtTime($("volume").value/100,ctx.currentTime,.02);
};
function changeOct(n){
 octave=Math.max(1,Math.min(7,octave+n));
 $("octaveDisplay").textContent="OCT "+octave;
 $("status").textContent="OCT "+octave;
}
$("upBtn").onclick=()=>changeOct(1);
$("downBtn").onclick=()=>changeOct(-1);

async function goLandscape(){
 try{
  if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();
  if(screen.orientation?.lock)await screen.orientation.lock("landscape");
 }catch(e){}
}
$("fullBtn").onclick=goLandscape;
build();
</script>
</body>
</html>
