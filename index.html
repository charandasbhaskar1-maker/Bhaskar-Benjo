
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Bhaskar Benjo</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#090b12;color:white;
 font-family:Arial,sans-serif;overflow:hidden;
}
.app{
 height:100dvh;display:flex;flex-direction:column;
 background:linear-gradient(140deg,#11182a,#070910);
}
header{
 height:54px;display:flex;align-items:center;
 justify-content:space-between;padding:0 14px;
 border-bottom:1px solid #252c3d;
}
.logo{font-weight:900;font-size:19px;color:#29d9ff}
.logo span{color:#a78bfa}
.status{font-size:11px;color:#a7b4ca}
.controls{
 display:flex;align-items:center;justify-content:center;
 gap:8px;padding:10px;flex-wrap:wrap;
}
button{
 background:#171e2d;color:white;border:1px solid #35415b;
 border-radius:9px;padding:9px 13px;font-size:13px;
 font-weight:bold;touch-action:manipulation;
}
button:active{background:#6847ed}
button.active{background:#7855ff;border-color:#957bff}
.volume{display:flex;align-items:center;gap:6px;color:#aaa;font-size:12px}
input[type=range]{width:100px;accent-color:#8c65ff}
.keyboard-area{
 flex:1;min-height:0;display:flex;flex-direction:column;
 justify-content:center;padding:8px 8px 15px;
}
.scroll-controls{
 display:flex;align-items:center;justify-content:space-between;
 padding:4px 0 10px;
}
.scroll-controls small{color:#8895ab;font-size:11px}
.keyboard-scroll{
 width:100%;height:min(64vh,360px);
 overflow-x:auto;overflow-y:hidden;
 scrollbar-width:thin;scrollbar-color:#7255ef #1a2130;
 border-radius:9px;
}
.keyboard{
 height:100%;position:relative;
 min-width:100%;
 user-select:none;-webkit-user-select:none;
}
.key{
 position:absolute;top:0;
 display:flex;flex-direction:column;align-items:center;
 justify-content:flex-end;
 cursor:pointer;touch-action:none;
 border-radius:0 0 6px 6px;
}
.white{
 height:100%;background:linear-gradient(#fff,#e6eaf1);
 border:1px solid #aeb6c4;
 color:#263143;z-index:1;
}
.white.active{
 background:linear-gradient(#c4eaff,#75c8ff);
}
.black{
 height:63%;background:linear-gradient(180deg,#30394c,#090c13);
 border:1px solid #05070b;
 color:#e9edff;z-index:3;
 border-radius:0 0 5px 5px;
 box-shadow:0 5px 8px #0008;
}
.black.active{background:linear-gradient(#8869ff,#4d35b4)}
.note{
 font-size:10px;font-weight:bold;margin-bottom:5px;
 pointer-events:none;
}
.swar{
 font-size:9px;color:#65748b;margin-bottom:9px;
 pointer-events:none;
}
.black .note{font-size:9px;margin-bottom:5px}
.black .swar{display:none}
footer{
 text-align:center;padding:8px;color:#64748b;font-size:10px;
}
@media (orientation:portrait){
 .app{min-height:100dvh}
 .keyboard-scroll{height:45vh}
}
</style>
</head>

<body>
<div class="app">

<header>
 <div class="logo">BHASKAR <span>BENJO</span></div>
 <div class="status" id="status">बैंजो तैयार 🎵</div>
</header>

<div class="controls">
 <button id="soundBtn" class="active">🔊 SOUND</button>
 <button id="stopBtn">⏹ STOP</button>
 <button id="octDown">− OCT</button>
 <button id="octUp">+ OCT</button>
 <div class="volume">
  VOL
  <input id="volume" type="range" min="0" max="100" value="70">
 </div>
</div>

<div class="keyboard-area">

<div class="scroll-controls">
 <button id="leftBtn">◀</button>
 <small>27 BENJO NOTES · SCROLL ↔</small>
 <button id="rightBtn">▶</button>
</div>

<div class="keyboard-scroll" id="scrollBox">
 <div class="keyboard" id="keyboard"></div>
</div>

</div>

<footer>BHASKAR BENJO · INDIAN ELECTRONIC INSTRUMENT</footer>
</div>

<script>
const keyboard=document.getElementById("keyboard");
const scrollBox=document.getElementById("scrollBox");
const status=document.getElementById("status");

let baseMidi=48;
const totalNotes=27;
const whiteWidth=56;
const blackWidth=34;

let audio=null;
let master=null;
let enabled=true;
let volume=0.70;

const activeVoices=new Map();

const noteNames=["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
const swarNames=["सा","रे","रे","ग","ग","म","म","प","प","ध","ध","नि"];

function isBlack(n){
 return [1,3,6,8,10].includes(n%12);
}

function ensureAudio(){
 if(audio)return;
 audio=new (window.AudioContext||window.webkitAudioContext)();
 master=audio.createGain();
 master.gain.value=volume;
 master.connect(audio.destination);
}

function midiFreq(n){
 return 440*Math.pow(2,(n-69)/12);
}

function startVoice(id,midi){
 ensureAudio();
 if(audio.state==="suspended")audio.resume();

 stopVoice(id);

 const now=audio.currentTime;
 const group=audio.createGain();
 group.gain.setValueAtTime(0.0001,now);
 group.gain.exponentialRampToValueAtTime(0.45,now+0.012);
 group.gain.exponentialRampToValueAtTime(0.16,now+0.20);
 group.connect(master);

 const osc1=audio.createOscillator();
 const osc2=audio.createOscillator();
 const osc3=audio.createOscillator();

 osc1.type="sawtooth";
 osc2.type="triangle";
 osc3.type="sine";

 osc1.frequency.value=midiFreq(midi);
 osc2.frequency.value=midiFreq(midi)*2;
 osc3.frequency.value=midiFreq(midi)*3;

 const g1=audio.createGain();
 const g2=audio.createGain();
 const g3=audio.createGain();

 g1.gain.value=0.52;
 g2.gain.value=0.24;
 g3.gain.value=0.10;

 osc1.connect(g1);g1.connect(group);
 osc2.connect(g2);g2.connect(group);
 osc3.connect(g3);g3.connect(group);

 osc1.start(now);
 osc2.start(now);
 osc3.start(now);

 activeVoices.set(id,{group,osc1,osc2,osc3,midi});
}

function stopVoice(id){
 const v=activeVoices.get(id);
 if(!v)return;

 const now=audio.currentTime;
 v.group.gain.cancelScheduledValues(now);
 v.group.gain.setTargetAtTime(0.0001,now,0.045);

 try{
  v.osc1.stop(now+0.20);
  v.osc2.stop(now+0.20);
  v.osc3.stop(now+0.20);
 }catch(e){}

 activeVoices.delete(id);
}

function glideVoice(id,midi){
 const v=activeVoices.get(id);
 if(!v||v.midi===midi)return;

 const now=audio.currentTime;
 const f=midiFreq(midi);

 v.osc1.frequency.setTargetAtTime(f,now,0.025);
 v.osc2.frequency.setTargetAtTime(f*2,now,0.025);
 v.osc3.frequency.setTargetAtTime(f*3,now,0.025);
 v.midi=midi;
}

function buildKeyboard(){
 keyboard.innerHTML="";

 let whiteCount=0;
 const notes=[];

 for(let i=0;i<totalNotes;i++){
  const midi=baseMidi+i;
  const black=isBlack(midi);

  if(!black){
   notes.push({midi,black:false,whiteIndex:whiteCount});
   whiteCount++;
  }else{
   notes.push({midi,black:true,whiteIndex:whiteCount});
  }
 }

 keyboard.style.width=(whiteCount*whiteWidth)+"px";

 notes.forEach(n=>{
  const el=document.createElement("div");
  el.className="key "+(n.black?"black":"white");
  el.dataset.midi=n.midi;

  if(n.black){
   el.style.width=blackWidth+"px";
   el.style.left=(n.whiteIndex*whiteWidth-blackWidth/2)+"px";
  }else{
   el.style.width=whiteWidth+"px";
   el.style.left=(n.whiteIndex*whiteWidth)+"px";
  }

  const name=noteNames[n.midi%12];
  const octave=Math.floor(n.midi/12)-1;

  const label=document.createElement("div");
  label.className="note";
  label.textContent=name+octave;

  const swar=document.createElement("div");
  swar.className="swar";
  swar.textContent=swarNames[n.midi%12];

  el.appendChild(label);
  el.appendChild(swar);

  el.addEventListener("pointerdown",e=>{
   e.preventDefault();
   if(!enabled)return;
   el.classList.add("active");
   startVoice(e.pointerId,n.midi);
   status.textContent="🎵 "+name+octave;
  });

  keyboard.appendChild(el);
 });

 // Black keys always stay above white keys
 keyboard.querySelectorAll(".black").forEach(k=>{
  k.style.zIndex=3;
 });
}

function getKeyAt(x,y){
 const el=document.elementFromPoint(x,y);
 return el?.closest(".key");
}

function moveVoice(e){
 if(!activeVoices.has(e.pointerId))return;
 const key=getKeyAt(e.clientX,e.clientY);
 if(!key)return;

 const midi=Number(key.dataset.midi);
 glideVoice(e.pointerId,midi);

 keyboard.querySelectorAll(".key").forEach(k=>{
  k.classList.toggle("active",Number(k.dataset.midi)===midi);
 });
}

document.addEventListener("pointermove",moveVoice);

function releaseAll(){
 [...activeVoices.keys()].forEach(id=>stopVoice(id));
 keyboard.querySelectorAll(".key").forEach(k=>k.classList.remove("active"));
 status.textContent="बैंजो तैयार 🎵";
}

document.addEventListener("pointerup",e=>{
 stopVoice(e.pointerId);
 keyboard.querySelectorAll(".key").forEach(k=>k.classList.remove("active"));
});
document.addEventListener("pointercancel",releaseAll);

document.getElementById("stopBtn").onclick=releaseAll;

document.getElementById("soundBtn").onclick=()=>{
 enabled=!enabled;
 const b=document.getElementById("soundBtn");
 b.classList.toggle("active",enabled);
 b.textContent=enabled?"🔊 SOUND":"🔇 SOUND";
 if(!enabled)releaseAll();
};

document.getElementById("volume").oninput=e=>{
 volume=Number(e.target.value)/100;
 if(master)master.gain.value=volume;
};

document.getElementById("octDown").onclick=()=>{
 releaseAll();
 baseMidi-=12;
 buildKeyboard();
 scrollBox.scrollLeft=0;
};

document.getElementById("octUp").onclick=()=>{
 releaseAll();
 baseMidi+=12;
 buildKeyboard();
 scrollBox.scrollLeft=0;
};

document.getElementById("leftBtn").onclick=()=>{
 scrollBox.scrollBy({left:-350,behavior:"smooth"});
};

document.getElementById("rightBtn").onclick=()=>{
 scrollBox.scrollBy({left:350,behavior:"smooth"});
};

buildKeyboard();
</script>
</body>
</html>
