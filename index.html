
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Bhaskar Benjo V3</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;background:#080b12;color:white;
  font-family:Arial,sans-serif;overflow:hidden;
  touch-action:none;
}
.app{
  height:100dvh;width:100vw;
  display:flex;flex-direction:column;
  padding:10px;gap:10px;
}
.header{
  display:flex;align-items:center;justify-content:space-between;
  background:#151b28;border:1px solid #263449;
  padding:10px 14px;border-radius:15px;
}
.brand{font-size:21px;font-weight:bold;color:#29d9ff}
.version{font-size:11px;color:#8e9bb0}
.display{
  background:#101827;border:1px solid #263449;
  border-radius:14px;padding:8px 14px;
  display:flex;align-items:center;justify-content:space-between;
}
#noteDisplay{font-size:25px;color:#29d9ff;font-weight:bold}
#status{font-size:12px;color:#a3b2c8}
.controls{
  display:flex;align-items:center;justify-content:center;
  flex-wrap:wrap;gap:8px;
}
button{
  border:1px solid #344359;border-radius:10px;
  background:#192334;color:white;
  padding:10px 14px;font-size:14px;font-weight:bold;
}
button:active{background:#8057ff}
#soundBtn{background:#176c56}
.stop{background:#9c2838}
.volume{
  background:#151b28;padding:8px 12px;border-radius:12px;
  display:flex;align-items:center;gap:8px;font-size:12px;
}
input[type=range]{width:100px;accent-color:#29d9ff}
.keys{
  flex:1;min-height:120px;
  display:grid;grid-template-columns:repeat(12,minmax(0,1fr));
  gap:5px;padding:5px 2px 12px;
}
.key{
  border-radius:0 0 13px 13px;
  background:linear-gradient(180deg,#f8fbff,#c5d0df);
  color:#111827;border:1px solid #91a0b5;
  display:flex;flex-direction:column;
  justify-content:flex-end;align-items:center;
  padding:10px 2px;font-weight:bold;
  box-shadow:0 5px 0 #64748b;
  user-select:none;-webkit-user-select:none;
  touch-action:none;
}
.key .western{font-size:clamp(12px,2vw,20px)}
.key .indian{font-size:clamp(10px,1.6vw,15px);color:#45566d;margin-top:6px}
.key.active{
  background:linear-gradient(180deg,#a5f5ff,#29d9ff);
  box-shadow:0 1px 0 #1689a6;transform:translateY(4px);
}
.footer{text-align:center;font-size:10px;color:#66768e;padding-bottom:3px}
.rotate{
  display:none;position:fixed;inset:0;background:#080b12;
  z-index:999;align-items:center;justify-content:center;
  text-align:center;padding:30px;
}
.rotate button{margin-top:20px;background:#8057ff}
@media(orientation:portrait){
  .rotate{display:flex}
}
@media(orientation:landscape){
  .app{padding:7px;gap:6px}
  .header{padding:6px 12px}
  .brand{font-size:18px}
  .display{padding:5px 12px}
  #noteDisplay{font-size:21px}
  button{padding:8px 12px}
  .keys{padding-bottom:8px}
}
</style>
</head>

<body>

<div class="rotate">
  <div>
    <div style="font-size:50px">🎸</div>
    <h2>Bhaskar Benjo</h2>
    <p>बेहतर बजाने के लिए मोबाइल को Landscape करें</p>
    <button onclick="goLandscape()">LANDSCAPE खोलें</button>
  </div>
</div>

<div class="app">

  <div class="header">
    <div class="brand">🎸 Bhaskar Benjo</div>
    <div class="version">SOUND ENGINE V3</div>
  </div>

  <div class="display">
    <div id="noteDisplay">सा</div>
    <div id="status">Benjo Ready</div>
  </div>

  <div class="controls">
    <button id="soundBtn">🔊 SOUND ON</button>
    <button class="stop" id="stopBtn">⏹ STOP</button>
    <button id="fullBtn">⛶ FULL</button>

    <button id="downBtn">− OCT</button>
    <div id="octaveDisplay">OCT 3</div>
    <button id="upBtn">+ OCT</button>

    <div class="volume">
      VOL
      <input id="volume" type="range" min="0" max="100" value="75">
      <span id="volText">75%</span>
    </div>
  </div>

  <div class="keys" id="keyboard"></div>

  <div class="footer">BHASKAR BENJO • INDIAN ELECTRONIC INSTRUMENT</div>
</div>

<script>
const noteDisplay = document.getElementById("noteDisplay");
const statusEl = document.getElementById("status");
const soundBtn = document.getElementById("soundBtn");
const octaveDisplay = document.getElementById("octaveDisplay");
const keyboard = document.getElementById("keyboard");
const volume = document.getElementById("volume");
const volText = document.getElementById("volText");

let audioCtx = null;
let master = null;
let soundOn = true;
let octave = 3;

const notes = [
  {name:"C", indian:"सा"},
  {name:"C#",indian:"रे♭"},
  {name:"D", indian:"रे"},
  {name:"D#",indian:"ग♭"},
  {name:"E", indian:"ग"},
  {name:"F", indian:"म"},
  {name:"F#",indian:"म♭"},
  {name:"G", indian:"प"},
  {name:"G#",indian:"ध♭"},
  {name:"A", indian:"ध"},
  {name:"A#",indian:"नि♭"},
  {name:"B", indian:"नि"}
];

const voices = new Map();
const pointers = new Map();
const keyElements = [];

function initAudio(){
  if(audioCtx)return;

  audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  master = audioCtx.createGain();
  master.gain.value = volume.value/100;

  const compressor = audioCtx.createDynamicsCompressor();
  compressor.threshold.value = -15;
  compressor.knee.value = 15;
  compressor.ratio.value = 4;
  compressor.attack.value = 0.003;
  compressor.release.value = 0.18;

  master.connect(compressor);
  compressor.connect(audioCtx.destination);
}

function hz(midi){
  return 440*Math.pow(2,(midi-69)/12);
}

function midi(index){
  return 12*(octave+1)+index;
}

function createVoice(index,pid){
  initAudio();
  if(audioCtx.state==="suspended")audioCtx.resume();

  const now=audioCtx.currentTime;
  const fundamental=hz(midi(index));

  const amp=audioCtx.createGain();
  amp.gain.setValueAtTime(0.0001,now);

  amp.gain.exponentialRampToValueAtTime(0.65,now+0.008);
  amp.gain.exponentialRampToValueAtTime(0.35,now+0.08);

  const filter=audioCtx.createBiquadFilter();
  filter.type="lowpass";
  filter.frequency.value=5200;
  filter.Q.value=1.1;

  const oscillators=[];

  // Metallic Indian electronic benjo harmonics
  const partials=[
    {ratio:1, gain:0.90, type:"sawtooth"},
    {ratio:2, gain:0.34, type:"triangle"},
    {ratio:3, gain:0.19, type:"sawtooth"},
    {ratio:4, gain:0.10, type:"triangle"},
    {ratio:5.02,gain:0.055,type:"sine"}
  ];

  partials.forEach(part=>{
    const osc=audioCtx.createOscillator();
    const g=audioCtx.createGain();

    osc.type=part.type;
    osc.frequency.value=fundamental*part.ratio;
    g.gain.value=part.gain;

    osc.connect(g);
    g.connect(filter);

    osc.start(now);
    oscillators.push({osc,g,ratio:part.ratio});
  });

  // Plucked metallic attack
  const attackOsc=audioCtx.createOscillator();
  const attackGain=audioCtx.createGain();

  attackOsc.type="square";
  attackOsc.frequency.value=fundamental*2.01;

  attackGain.gain.setValueAtTime(0.0001,now);
  attackGain.gain.exponentialRampToValueAtTime(0.10,now+0.003);
  attackGain.gain.exponentialRampToValueAtTime(0.0001,now+0.045);

  attackOsc.connect(attackGain);
  attackGain.connect(filter);
  attackOsc.start(now);
  attackOsc.stop(now+0.06);

  // Metallic string-like resonance
  const resonance=audioCtx.createOscillator();
  const resonanceGain=audioCtx.createGain();

  resonance.type="sine";
  resonance.frequency.value=fundamental*2.76;
  resonanceGain.gain.value=0.035;

  resonance.connect(resonanceGain);
  resonanceGain.connect(filter);
  resonance.start(now);

  filter.connect(amp);
  amp.connect(master);

  voices.set(pid,{
    amp,filter,oscillators,resonance,resonanceGain,
    index,started:now
  });

  pointers.set(pid,index);
  paintKey(index,true);
  showNote(index);
}

function glideVoice(pid,newIndex){
  const voice=voices.get(pid);
  if(!voice)return;

  const now=audioCtx.currentTime;
  const target=hz(midi(newIndex));

  voice.oscillators.forEach(item=>{
    item.osc.frequency.setTargetAtTime(
      target*item.ratio,now,0.025
    );
  });

  voice.resonance.frequency.setTargetAtTime(
    target*2.76,now,0.03
  );

  voice.index=newIndex;
  pointers.set(pid,newIndex);
  paintKey(newIndex,true);
  showNote(newIndex);
}

function releaseVoice(pid){
  const voice=voices.get(pid);
  if(!voice)return;

  const now=audioCtx.currentTime;

  voice.amp.gain.cancelScheduledValues(now);
  voice.amp.gain.setValueAtTime(
    Math.max(voice.amp.gain.value,0.0001),now
  );
  voice.amp.gain.exponentialRampToValueAtTime(0.0001,now+0.18);

  voice.oscillators.forEach(item=>{
    item.osc.stop(now+0.20);
  });

  voice.resonance.stop(now+0.20);

  setTimeout(()=>{
    voice.amp.disconnect();
    voice.filter.disconnect();
  },250);

  paintKey(voice.index,false);
  voices.delete(pid);
  pointers.delete(pid);
}

function paintKey(index,on){
  const el=keyElements[index];
  if(el)el.classList.toggle("active",on);
}

function showNote(index){
  noteDisplay.textContent=notes[index].indian;
  statusEl.textContent=notes[index].name+" • "+octave;
}

function stopAll(){
  [...voices.keys()].forEach(releaseVoice);
  noteDisplay.textContent="—";
  statusEl.textContent="STOPPED";
}

function buildKeyboard(){
  keyboard.innerHTML="";
  keyElements.length=0;

  notes.forEach((n,index)=>{
    const el=document.createElement("div");
    el.className="key";
    el.innerHTML=
      '<span class="western">'+n.name+'</span>'+
      '<span class="indian">'+n.indian+'</span>';

    el.dataset.index=index;
    keyboard.appendChild(el);
    keyElements.push(el);
  });
}

function keyAt(x,y){
  const element=document.elementFromPoint(x,y);
  const key=element?.closest(".key");
  return key ? Number(key.dataset.index) : null;
}

function pointerDown(e){
  const index=keyAt(e.clientX,e.clientY);
  if(index===null)return;

  e.preventDefault();
  initAudio();

  const pid=e.pointerId;
  if(voices.has(pid))releaseVoice(pid);

  createVoice(index,pid);
  e.target.setPointerCapture?.(pid);
}

function pointerMove(e){
  if(!voices.has(e.pointerId))return;
  e.preventDefault();

  const index=keyAt(e.clientX,e.clientY);
  if(index===null)return;

  const old=pointers.get(e.pointerId);
  if(old!==index){
    paintKey(old,false);
    glideVoice(e.pointerId,index);
  }
}

function pointerUp(e){
  releaseVoice(e.pointerId);
}

keyboard.addEventListener("pointerdown",pointerDown);
keyboard.addEventListener("pointermove",pointerMove);
keyboard.addEventListener("pointerup",pointerUp);
keyboard.addEventListener("pointercancel",pointerUp);
keyboard.addEventListener("lostpointercapture",pointerUp);

soundBtn.onclick=()=>{
  soundOn=!soundOn;
  soundBtn.textContent=soundOn?"🔊 SOUND ON":"🔇 SOUND OFF";
  soundBtn.style.background=soundOn?"#176c56":"#7c2635";

  if(master){
    master.gain.setTargetAtTime(
      soundOn?volume.value/100:0,
      audioCtx.currentTime,0.03
    );
  }
};

document.getElementById("stopBtn").onclick=stopAll;

volume.oninput=()=>{
  volText.textContent=volume.value+"%";
  if(master && soundOn){
    master.gain.setTargetAtTime(
      volume.value/100,audioCtx.currentTime,0.02
    );
  }
};

function changeOctave(amount){
  octave=Math.max(1,Math.min(7,octave+amount));
  octaveDisplay.textContent="OCT "+octave;
  statusEl.textContent="OCTAVE "+octave;
}

document.getElementById("upBtn").onclick=()=>changeOctave(1);
document.getElementById("downBtn").onclick=()=>changeOctave(-1);

async function goLandscape(){
  try{
    if(document.documentElement.requestFullscreen)
      await document.documentElement.requestFullscreen();

    if(screen.orientation?.lock)
      await screen.orientation.lock("landscape");
  }catch(e){
    alert("मोबाइल को Landscape घुमाएँ।");
  }
}

document.getElementById("fullBtn").onclick=goLandscape;

buildKeyboard();
</script>
</body>
</html>
