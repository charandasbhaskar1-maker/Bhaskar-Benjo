<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#080b12">
<title>Bhaskar Benjo</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  background: #080b12;
  color: #f5f7ff;
  font-family: system-ui, Arial, sans-serif;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
}

button {
  border: none;
  outline: none;
  color: white;
  font-weight: 800;
  cursor: pointer;
  touch-action: manipulation;
}

.app {
  width: 100%;
  height: 100dvh;
  padding: 8px;
  display: flex;
  flex-direction: column;
}

.header {
  display: flex;
  align-items: center;
  gap: 10px;
  background: #151b28;
  padding: 9px 12px;
  border-radius: 15px;
  flex-shrink: 0;
}

.logo {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  background: linear-gradient(135deg, #8057ff, #29d9ff);
  display: grid;
  place-items: center;
  font-size: 23px;
}

.header h1 {
  margin: 0;
  font-size: 17px;
}

.header p {
  margin: 2px 0 0;
  font-size: 10px;
  color: #9aa5b8;
}

.panel {
  flex: 1;
  min-height: 0;
  margin-top: 8px;
  padding: 8px;
  background: #151b28;
  border-radius: 15px;
  display: flex;
  flex-direction: column;
}

.topbar {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}

.display {
  flex: 1;
  min-width: 0;
  background: #080b12;
  border-radius: 10px;
  padding: 5px 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 42px;
}

.note {
  font-size: 23px;
  font-weight: 900;
  color: #29d9ff;
  white-space: nowrap;
}

.status {
  font-size: 10px;
  color: #9aa5b8;
  text-align: right;
}

.btn {
  background: #252e42;
  border-radius: 10px;
  padding: 10px 12px;
  min-height: 40px;
  font-size: 12px;
}

.btn-purple {
  background: #8057ff;
}

.btn-stop {
  background: #263047;
}

.controls {
  display: flex;
  gap: 6px;
  flex-shrink: 0;
  margin-top: 6px;
}

.controls button {
  flex: 1;
}

.volume {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 5px 3px;
  flex-shrink: 0;
}

.volume span {
  font-size: 11px;
  color: #9aa5b8;
}

input[type="range"] {
  flex: 1;
  min-width: 0;
  accent-color: #8057ff;
}

.octave {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  flex-shrink: 0;
  margin: 4px 0;
}

.octave button {
  width: 42px;
  height: 32px;
  border-radius: 9px;
  background: #252e42;
  font-size: 18px;
}

.octave-info {
  text-align: center;
  min-width: 60px;
}

.octave-info span {
  display: block;
  color: #9aa5b8;
  font-size: 9px;
}

.octave-info strong {
  font-size: 16px;
}

.keyboard {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: repeat(12, minmax(0, 1fr));
  gap: 4px;
  margin-top: 4px;
  touch-action: none;
}

.key {
  position: relative;
  min-width: 0;
  border-radius: 0 0 8px 8px;
  border: 1px solid #454e60;
  display: flex;
  justify-content: center;
  align-items: flex-end;
  padding: 0 0 8px;
  font-size: clamp(9px, 2.5vw, 13px);
  font-weight: 800;
  overflow: hidden;
  touch-action: none;
}

.key.white {
  color: #111827;
  background: linear-gradient(180deg, #ffffff, #dce4ef);
  border-color: #aeb8c8;
}

.key.black {
  color: #f5f7ff;
  background: linear-gradient(180deg, #30394c, #080b12);
  border-color: #41495a;
}

.key.active {
  background: linear-gradient(180deg, #29d9ff, #8057ff) !important;
  color: white !important;
  border-color: #29d9ff;
  box-shadow: 0 0 12px #29d9ff55;
}

.key-label {
  text-align: center;
  line-height: 1.3;
  pointer-events: none;
}

.key-label small {
  display: block;
  font-size: 9px;
  font-weight: 600;
}

.footer {
  text-align: center;
  color: #66738a;
  font-size: 9px;
  padding: 3px 0 0;
  flex-shrink: 0;
}

.rotate-message {
  position: fixed;
  inset: 0;
  z-index: 100;
  background: #080b12;
  display: none;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 25px;
}

.rotate-card {
  background: #151b28;
  border-radius: 20px;
  padding: 25px;
  max-width: 320px;
}

.rotate-icon {
  font-size: 55px;
}

.rotate-card h2 {
  margin: 8px 0;
}

.rotate-card p {
  color: #9aa5b8;
  font-size: 14px;
}

.rotate-card button {
  background: #8057ff;
  padding: 13px 20px;
  border-radius: 12px;
}

@media (orientation: portrait) {
  .rotate-message {
    display: flex;
  }
}

@media (orientation: landscape) {
  .app {
    padding: 4px;
  }

  .header {
    display: none;
  }

  .panel {
    margin: 0;
    padding: 5px;
    border-radius: 10px;
  }

  .display {
    min-height: 34px;
    padding: 3px 10px;
  }

  .note {
    font-size: 19px;
  }

  .controls {
    margin-top: 4px;
  }

  .btn {
    min-height: 32px;
    padding: 6px;
  }

  .volume {
    margin: 3px;
  }

  .octave {
    margin: 2px;
    gap: 8px;
  }

  .octave button {
    height: 27px;
  }

  .keyboard {
    margin-top: 3px;
    gap: 3px;
  }

  .key {
    height: 100%;
    padding-bottom: 4px;
    border-radius: 0 0 5px 5px;
  }

  .footer {
    display: none;
  }
}
</style>
</head>

<body>

<div class="rotate-message" id="rotateMessage">
  <div class="rotate-card">
    <div class="rotate-icon">🎸</div>
    <h2>Bhaskar Benjo</h2>
    <p>बैंजो बजाने के लिए मोबाइल को आड़ा करें।</p>
    <button onclick="openLandscape()">Landscape खोलें</button>
  </div>
</div>

<div class="app">

  <div class="header">
    <div class="logo">🎸</div>
    <div>
      <h1>Bhaskar Benjo</h1>
      <p>Indian Electronic Benjo</p>
    </div>
  </div>

  <div class="panel">

    <div class="topbar">
      <div class="display">
        <div class="note" id="noteDisplay">READY</div>
        <div class="status" id="status">बैंजो बजाएँ</div>
      </div>
    </div>

    <div class="controls">
      <button class="btn btn-purple" id="soundBtn" onclick="toggleSound()">🔊 SOUND ON</button>
      <button class="btn btn-stop" onclick="stopAll()">■ STOP</button>
      <button class="btn" onclick="openLandscape()">⛶ FULL</button>
    </div>

    <div class="volume">
      <span>VOL</span>
      <input id="volume" type="range" min="0" max="100" value="75">
      <span id="volumeValue">75%</span>
    </div>

    <div class="octave">
      <button onclick="changeOctave(-1)">−</button>
      <div class="octave-info">
        <span>OCTAVE</span>
        <strong id="octaveDisplay">4</strong>
      </div>
      <button onclick="changeOctave(1)">+</button>
    </div>

    <div class="keyboard" id="keyboard"></div>

    <div class="footer">
      BHASKAR BENJO • TOUCH & SLIDE TO PLAY
    </div>

  </div>
</div>

<script>
let audioCtx = null;
let master = null;
let soundOn = true;
let octave = 4;
let activePointers = new Map();
let pointerNotes = new Map();

const notes = [
  {name:"C",  hindi:"सा", semitone:0,  black:false},
  {name:"C#", hindi:"",   semitone:1,  black:true},
  {name:"D",  hindi:"रे", semitone:2,  black:false},
  {name:"D#", hindi:"",   semitone:3,  black:true},
  {name:"E",  hindi:"ग", semitone:4,  black:false},
  {name:"F",  hindi:"म", semitone:5,  black:false},
  {name:"F#", hindi:"",   semitone:6,  black:true},
  {name:"G",  hindi:"प", semitone:7,  black:false},
  {name:"G#", hindi:"",   semitone:8,  black:true},
  {name:"A",  hindi:"ध", semitone:9,  black:false},
  {name:"A#", hindi:"",   semitone:10, black:true},
  {name:"B",  hindi:"नि", semitone:11, black:false}
];

function initAudio(){
  if(audioCtx) return;

  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  master = audioCtx.createGain();
  master.gain.value = document.getElementById("volume").value / 100;
  master.connect(audioCtx.destination);
}

function midiFrequency(midi){
  return 440 * Math.pow(2, (midi - 69) / 12);
}

function makeVoice(noteIndex, pointerId){
  if(!soundOn) return;

  initAudio();

  if(audioCtx.state === "suspended"){
    audioCtx.resume();
  }

  releasePointer(pointerId);

  const midi = 12 * (octave + 1) + notes[noteIndex].semitone;
  const freq = midiFrequency(midi);
  const now = audioCtx.currentTime;

  const voiceGain = audioCtx.createGain();
  voiceGain.gain.setValueAtTime(0.0001, now);
  voiceGain.gain.exponentialRampToValueAtTime(0.45, now + 0.008);
  voiceGain.gain.exponentialRampToValueAtTime(0.18, now + 0.12);
  voiceGain.connect(master);

  const filter = audioCtx.createBiquadFilter();
  filter.type = "lowpass";
  filter.frequency.value = 6000;
  filter.connect(voiceGain);

  const oscillators = [];

  const configs = [
    {type:"triangle", frequency:freq,      gain:0.8},
    {type:"sawtooth",frequency:freq*2.0, gain:0.12},
    {type:"sine",    frequency:freq*3.0, gain:0.07}
  ];

  configs.forEach(config=>{
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = config.type;
    osc.frequency.value = config.frequency;
    gain.gain.value = config.gain;

    osc.connect(gain);
    gain.connect(filter);
    osc.start(now);

    oscillators.push({osc,gain});
  });

  activePointers.set(pointerId,{
    voiceGain,
    filter,
    oscillators,
    noteIndex
  });

  pointerNotes.set(pointerId,noteIndex);
  updateKeys();
  updateDisplay(noteIndex);
}

function releasePointer(pointerId){
  const voice = activePointers.get(pointerId);
  if(!voice) return;

  const now = audioCtx.currentTime;

  voice.voiceGain.gain.cancelScheduledValues(now);
  voice.voiceGain.gain.setValueAtTime(
    Math.max(voice.voiceGain.gain.value,0.0001),now
  );
  voice.voiceGain.gain.exponentialRampToValueAtTime(0.0001,now+0.08);

  voice.oscillators.forEach(item=>{
    try{
      item.osc.stop(now+0.09);
    }catch(e){}
  });

  activePointers.delete(pointerId);
  pointerNotes.delete(pointerId);
  updateKeys();
}

function updateDisplay(index){
  document.getElementById("noteDisplay").textContent =
    notes[index].name + octave;
  document.getElementById("status").textContent =
    "बैंजो नोट बज रहा है";
}

function updateKeys(){
  document.querySelectorAll(".key").forEach(key=>{
    const index = Number(key.dataset.index);
    const playing = [...pointerNotes.values()].includes(index);
    key.classList.toggle("active",playing);
  });
}

function stopAll(){
  [...activePointers.keys()].forEach(releasePointer);
  document.getElementById("noteDisplay").textContent = "READY";
  document.getElementById("status").textContent = "बैंजो बजाएँ";
}

function toggleSound(){
  soundOn = !soundOn;

  const btn = document.getElementById("soundBtn");
  btn.textContent = soundOn ? "🔊 SOUND ON" : "🔇 SOUND OFF";
  btn.classList.toggle("btn-purple",soundOn);

  if(!soundOn) stopAll();
}

function changeOctave(delta){
  octave = Math.max(2,Math.min(6,octave+delta));
  document.getElementById("octaveDisplay").textContent = octave;
}

document.getElementById("volume").addEventListener("input",e=>{
  const value = Number(e.target.value);
  document.getElementById("volumeValue").textContent = value+"%";
  if(master) master.gain.value = value/100;
});

function getKeyAtPoint(x,y){
  const el = document.elementFromPoint(x,y);
  return el ? el.closest(".key") : null;
}

const keyboard = document.getElementById("keyboard");

notes.forEach((note,index)=>{
  const key = document.createElement("div");
  key.className = "key "+(note.black ? "black" : "white");
  key.dataset.index = index;

  key.innerHTML = `
    <div class="key-label">
      ${note.name}
      <small>${note.hindi}</small>
    </div>
  `;

  key.addEventListener("pointerdown",e=>{
    e.preventDefault();
    key.setPointerCapture(e.pointerId);
    makeVoice(index,e.pointerId);
  });

  key.addEventListener("pointermove",e=>{
    if(!activePointers.has(e.pointerId)) return;

    const target = getKeyAtPoint(e.clientX,e.clientY);
    if(!target) return;

    const newIndex = Number(target.dataset.index);
    const oldIndex = pointerNotes.get(e.pointerId);

    if(newIndex !== oldIndex){
      makeVoice(newIndex,e.pointerId);
    }
  });

  key.addEventListener("pointerup",e=>{
    releasePointer(e.pointerId);
  });

  key.addEventListener("pointercancel",e=>{
    releasePointer(e.pointerId);
  });

  key.addEventListener("lostpointercapture",e=>{
    releasePointer(e.pointerId);
  });

  keyboard.appendChild(key);
});

async function openLandscape(){
  try{
    if(!document.fullscreenElement){
      await document.documentElement.requestFullscreen();
    }
  }catch(e){}

  try{
    if(screen.orientation && screen.orientation.lock){
      await screen.orientation.lock("landscape");
    }
  }catch(e){
    alert("यदि स्क्रीन आड़ी नहीं होती, तो मोबाइल का Auto-rotate ON करके फोन आड़ा करें।");
  }
}
</script>

</body>
</html>
