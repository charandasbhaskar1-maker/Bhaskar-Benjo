
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Bhaskar Benjo</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;background:#090b12;color:#f5f7ff;
  font-family:system-ui,Arial;overflow-x:hidden
}
.app{max-width:600px;margin:auto;padding:18px}
.header{
  display:flex;align-items:center;gap:12px;
  background:#151b28;padding:15px;border-radius:18px
}
.logo{
  width:48px;height:48px;border-radius:14px;
  display:grid;place-items:center;
  background:linear-gradient(135deg,#8057ff,#29d9ff);
  font-size:25px
}
.header h1{font-size:20px;margin:0}
.header p{margin:3px 0 0;color:#9aa5b8;font-size:12px}
.panel{
  margin-top:16px;background:#151b28;
  padding:16px;border-radius:20px
}
.label{font-size:13px;color:#9aa5b8}
.display{
  margin-top:8px;background:#090d16;padding:18px;
  border-radius:14px;text-align:center
}
.note{font-size:34px;color:#29d9ff;font-weight:800}
.status{font-size:12px;color:#9aa5b8;margin-top:5px}
.controls{display:flex;gap:10px;margin-top:15px}
button{
  border:0;border-radius:12px;padding:13px;
  color:white;font-weight:700;background:#252e42
}
button:active{transform:scale(.97)}
.control{flex:1}
.active{background:#8057ff}
.keyboard{
  display:grid;grid-template-columns:repeat(7,1fr);
  gap:5px;margin-top:18px;touch-action:none
}
.key{
  height:150px;border-radius:0 0 10px 10px;
  background:linear-gradient(#fff,#dfe5ee);
  color:#111827;border:1px solid #c5ccd8;
  display:flex;align-items:flex-end;justify-content:center;
  padding-bottom:10px;font-size:12px;font-weight:800;
  user-select:none;-webkit-user-select:none;
  touch-action:none
}
.key.black{
  background:linear-gradient(#252b39,#080b12);
  color:#fff;border-color:#353c4c
}
.key.playing{background:#29d9ff!important;color:#081018!important}
.octave{
  display:flex;align-items:center;justify-content:space-between;
  margin-top:16px
}
.octave button{min-width:55px}
.footer{
  text-align:center;color:#6f7c92;font-size:11px;
  padding:20px 0
}
input[type=range]{width:100%;accent-color:#8057ff}
</style>
</head>
<body>
<div class="app">

<div class="header">
  <div class="logo">🎸</div>
  <div>
    <h1>Bhaskar Benjo</h1>
    <p>Indian Electronic Benjo • Mobile Instrument</p>
  </div>
</div>

<div class="panel">
  <div class="label">साउंड इंजन</div>
  <div class="display">
    <div class="note" id="noteDisplay">READY</div>
    <div class="status" id="status">चाबी दबाकर बजाएँ</div>
  </div>

  <div class="controls">
    <button class="control active" id="soundBtn" onclick="toggleSound()">🔊 Sound ON</button>
    <button class="control" onclick="stopAll()">■ STOP</button>
  </div>

  <div style="margin-top:18px">
    <div class="label">Volume</div>
    <input id="volume" type="range" min="0" max="100" value="70">
  </div>

  <div class="octave">
    <button onclick="changeOctave(-1)">−</button>
    <div style="text-align:center">
      <div class="label">OCTAVE</div>
      <strong id="octaveDisplay">4</strong>
    </div>
    <button onclick="changeOctave(1)">+</button>
  </div>

  <div class="keyboard" id="keyboard"></div>
  <div class="footer">Touch keys to play • Prototype sound engine</div>
</div>
</div>

<script>
let audioCtx=null;
let master=null;
let soundOn=true;
let octave=4;
let activeNotes=new Map();

const notes=[
 ["C","सा",0,false],
 ["C#","",1,true],
 ["D","रे",2,false],
 ["D#","",3,true],
 ["E","ग",4,false],
 ["F","म",5,false],
 ["F#","",6,true],
 ["G","प",7,false],
 ["G#","",8,true],
 ["A","ध",9,false],
 ["A#","",10,true],
 ["B","नि",11,false]
];

function initAudio(){
 if(!audioCtx){
   audioCtx=new (window.AudioContext||window.webkitAudioContext)();
   master=audioCtx.createGain();
   master.gain.value=Number(document.getElementById("volume").value)/100;
   master.connect(audioCtx.destination);
 }
 if(audioCtx.state==="suspended")audioCtx.resume();
}

function frequency(n){
 return 440*Math.pow(2,(n-69)/12);
}

function playBenjo(index,key){
 if(!soundOn)return;
 initAudio();
 stopNote(index);

 const midi=12*(octave+1)+index;
 const freq=frequency(midi);
 const now=audioCtx.currentTime;

 const gain=audioCtx.createGain();
 gain.gain.setValueAtTime(0.0001,now);
 gain.gain.exponentialRampToValueAtTime(0.65,now+0.008);
 gain.gain.exponentialRampToValueAtTime(0.22,now+0.12);
 gain.connect(master);

 // Plucked-string style synthesis with metallic harmonics.
 // This is a prototype approximation, not a recorded benjo sample.
 const osc1=audioCtx.createOscillator();
 const osc2=audioCtx.createOscillator();
 const osc3=audioCtx.createOscillator();

 osc1.type="triangle";
 osc2.type="sawtooth";
 osc3.type="sine";

 osc1.frequency.setValueAtTime(freq,now);
 osc2.frequency.setValueAtTime(freq*2.01,now);
 osc3.frequency.setValueAtTime(freq*3.98,now);

 const g1=audioCtx.createGain();
 const g2=audioCtx.createGain();
 const g3=audioCtx.createGain();

 g1.gain.value=0.75;
 g2.gain.value=0.12;
 g3.gain.value=0.08;

 osc1.connect(g1);osc2.connect(g2);osc3.connect(g3);
 g1.connect(gain);g2.connect(gain);g3.connect(gain);

 osc1.start(now);osc2.start(now);osc3.start(now);

 activeNotes.set(index,{gain,osc:[osc1,osc2,osc3]});

 document.getElementById("noteDisplay").textContent=notes[index][0]+octave;
 document.getElementById("status").textContent="बैंजो नोट बज रहा है";
 key.classList.add("playing");
}

function stopNote(index){
 const item=activeNotes.get(index);
 if(!item)return;
 const now=audioCtx.currentTime;
 item.gain.gain.cancelScheduledValues(now);
 item.gain.gain.setValueAtTime(Math.max(item.gain.gain.value,0.0001),now);
 item.gain.gain.exponentialRampToValueAtTime(0.0001,now+0.18);
 item.osc.forEach(o=>{try{o.stop(now+0.2)}catch(e){}});
 activeNotes.delete(index);
 document.querySelectorAll(".key").forEach(k=>{
   if(Number(k.dataset.index)===index)k.classList.remove("playing");
 });
}

function stopAll(){
 [...activeNotes.keys()].forEach(stopNote);
 document.getElementById("noteDisplay").textContent="READY";
 document.getElementById("status").textContent="चाबी दबाकर बजाएँ";
}

function toggleSound(){
 soundOn=!soundOn;
 const btn=document.getElementById("soundBtn");
 btn.textContent=soundOn?"🔊 Sound ON":"🔇 Sound OFF";
 btn.classList.toggle("active",soundOn);
 if(!soundOn)stopAll();
}

function changeOctave(delta){
 octave=Math.max(2,Math.min(6,octave+delta));
 document.getElementById("octaveDisplay").textContent=octave;
}

document.getElementById("volume").addEventListener("input",e=>{
 if(master)master.gain.value=Number(e.target.value)/100;
});

const keyboard=document.getElementById("keyboard");
notes.forEach((n,i)=>{
 const key=document.createElement("div");
 key.className="key"+(n[3]?" black":"");
 key.dataset.index=i;
 key.innerHTML=n[0]+"<br>"+n[1];

 const start=e=>{
   e.preventDefault();
   key.setPointerCapture?.(e.pointerId);
   playBenjo(i,key);
 };
 const end=e=>{
   e.preventDefault();
   stopNote(i);
 };
 key.addEventListener("pointerdown",start);
 key.addEventListener("pointerup",end);
 key.addEventListener("pointercancel",end);
 key.addEventListener("lostpointercapture",end);
 keyboard.appendChild(key);
});
</script>
</body>
</html>
